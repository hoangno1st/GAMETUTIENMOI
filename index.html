<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09130f" />
    <meta
      name="description"
      content="Thanh Vân Sơn — an original browser-based cultivation adventure prototype."
    />
    <title>Thanh Vân Sơn — Ngoại Môn</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Thanh Vân Sơn game">
      <canvas
        id="game-canvas"
        width="1920"
        height="1080"
        tabindex="0"
        aria-label="Game canvas. Use WASD or arrow keys to move."
      ></canvas>
      <div id="loading" role="status">Đang khai mở sơn môn…</div>
    </main>

    <noscript>Trò chơi cần JavaScript để hoạt động.</noscript>
    <script>
      const loadingScreen = document.querySelector("#loading");

      if (window.location.protocol === "file:") {
        loadingScreen.classList.add("has-error");
        loadingScreen.innerHTML = `
          <strong>Không thể chạy game bằng cách mở trực tiếp index.html</strong>
          <span>Hãy chạy file <b>start-game.cmd</b> trong thư mục game.</span>
        `;
      } else {
        const showStartupError = (message) => {
          loadingScreen?.classList.add("has-error");
          if (loadingScreen) loadingScreen.dataset.error = "true";
          if (loadingScreen) {
            const title = document.createElement("strong");
            const detail = document.createElement("span");
            title.textContent = "Game không thể khởi động";
            detail.textContent = message || "Hãy mở F12 → Console và gửi dòng lỗi màu đỏ.";
            loadingScreen.replaceChildren(title, detail);
          }
        };

        window.addEventListener("error", (event) => {
          showStartupError(event.message);
        });
        window.addEventListener("unhandledrejection", (event) => {
          showStartupError(event.reason?.message || String(event.reason || "Lỗi không xác định"));
        });

        window.setTimeout(() => {
          if (loadingScreen && !loadingScreen.classList.contains("is-hidden")) {
            showStartupError(
              "Game tải quá lâu hoặc gặp lỗi. Hãy mở F12 → Console để xem chi tiết, hoặc thử tải lại trang (Ctrl+Shift+R).",
            );
          }
        }, 3000);
      }
    </script>
    <script type="module" src="./src/main.js?v=10" onerror="
      const ls = document.querySelector('#loading');
      if (ls) {
        ls.classList.add('has-error');
        ls.dataset.error = 'true';
        ls.innerHTML = '<strong>Không thể tải mã nguồn game</strong><span>Kiểm tra F12 → Console. Có thể server chưa chạy hoặc file bị lỗi.</span>';
      }
    "></script>
  </body>
</html>
